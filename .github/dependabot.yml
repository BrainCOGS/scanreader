# Dependabot configuration.
#
# Mirrors BrainCOGS/U19-pipeline-python (cooldowns, grouping, schedule).
# The uv 7-day quarantine (`exclude-newer`) lives in pyproject.toml and is added
# by the prek/workflows PR, which introduces pyproject.toml and uv.lock. The uv
# entry below only has an effect once that PR is merged.
#
# No `docker` or `npm` entries: the repo has no Dockerfile or JS code.

version: 2

updates:

  #
  # github-actions
  #
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

    rebase-strategy: "auto"

    # Version and security updates are grouped independently, so both need a
    # group or security fixes keep arriving as one PR per package.
    groups:
      actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # uv
  #
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    rebase-strategy: "auto"

    # Version and security updates are grouped independently, so both need a
    # group or security fixes keep arriving as one PR per package.
    groups:
      python:
        applies-to: "version-updates"
        patterns:
          - "*"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
